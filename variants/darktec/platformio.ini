[Darktec]
extends = nrf52_base
board = promicro_nrf52840
build_flags = ${nrf52_base.build_flags}
  -I variants/darktec
  -D NRF52_POWER_MANAGEMENT
  -D DARKTEC
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=DarktecSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_BOARD_SCL=7
  -D PIN_BOARD_SDA=8
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=6
  -D PIN_GPS_RX=3
  -D PIN_GPS_TX=4
  -D PIN_GPS_EN=5
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D TELEM_INA3221_SHUNT_VALUE=0.050
  ; Защита: DARKTEC_BATT_PROTECT_OFF | DARKTEC_BATT_PROTECT_ADC (см. battery_chemistry.h).
  ; OFF — без auto cutoff (нет bootlock/AUTO_SHUTDOWN); ADC — full sleep/wake.
  ; powerOff() в обоих режимах — ADC-wait (SYSTEMOFF не встаёт от VBAT на Darktec).
  -D DARKTEC_BATT_PROTECT=DARKTEC_BATT_PROTECT_ADC
  ; Батарея: BATTERY_CHEM_LIION | BATTERY_CHEM_LIFEPO4 | BATTERY_CHEM_LTO
  ; Li-ion/LiFePO4: только cells=1. LTO: cells=1 или 2 (макс. пакет 5 В).
  -D BATTERY_CHEMISTRY=BATTERY_CHEM_LIION
  -D BATTERY_CELLS=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<../variants/darktec>
lib_deps= ${nrf52_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library@^2.6.8
  stevemarple/MicroNMEA @ ^2.0.6

[env:Darktec_repeater]
extends = Darktec
build_src_filter = ${Darktec.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
build_flags =
  ${Darktec.build_flags}
  -D ADVERT_NAME='"Darktec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SSD1306Display
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps = ${Darktec.lib_deps}
  adafruit/RTClib @ ^2.1.3

[env:Darktec_repeater_bridge_rs232_serial1]
extends = Darktec
build_src_filter = ${Darktec.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/bridges/RS232Bridge.cpp>
build_flags =
  ${Darktec.build_flags}
  -D ADVERT_NAME='"RS232 Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SSD1306Display
  -D WITH_RS232_BRIDGE=Serial1
  -D WITH_RS232_BRIDGE_RX=PIN_SERIAL1_RX
  -D WITH_RS232_BRIDGE_TX=PIN_SERIAL1_TX
  -UENV_INCLUDE_GPS
;  -D BRIDGE_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps = ${Darktec.lib_deps}
  adafruit/RTClib @ ^2.1.3

[env:Darktec_room_server]
extends = Darktec
build_src_filter = ${Darktec.build_src_filter}
  +<../examples/simple_room_server>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
build_flags = ${Darktec.build_flags}
  -D ADVERT_NAME='"Darktec Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D DISPLAY_CLASS=SSD1306Display
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps = ${Darktec.lib_deps}
  adafruit/RTClib @ ^2.1.3

[env:Darktec_terminal_chat]
extends = Darktec
build_flags = ${Darktec.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Darktec.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps = ${Darktec.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/RTClib @ ^2.1.3

[env:Darktec_companion_radio_usb]
extends = Darktec
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Darktec.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=DarktecDisplay
  -D KEEP_DISPLAY_ON_USB
  -D WITH_COMPANION_CLI
  -DDISPLAY_TZ=\"MSK-3\"
; НЕ ВКЛЮЧАТЬ -->  -D MESH_PACKET_LOGGING=1
; НЕ ВКЛЮЧАТЬ -->  -D MESH_DEBUG=1
  -D CYRILLIC_SUPPORT=1
build_src_filter = ${Darktec.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Darktec.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0

[env:Darktec_companion_radio_ble]
extends = Darktec
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Darktec.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=DarktecDisplay
  -D KEEP_DISPLAY_ON_USB
  -D WITH_COMPANION_CLI
  -DDISPLAY_TZ=\"MSK-3\"
;  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
  -D CYRILLIC_SUPPORT=1
build_src_filter = ${Darktec.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Darktec.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0

[env:Darktec_sensor]
extends = Darktec
build_flags =
