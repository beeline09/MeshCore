; ProMicro NRF52840 + WeAct Epaper 2.13" + EBYTE E22/E22P (SX1262) or RA-62 (LLCC68)
; Radio: SPI  — SCK=D12, MOSI=D14, MISO=D15, CS=D13, RST=D10, DIO1=D11, BUSY=D16, RXEN=D2
; Display: SPI (shared with radio) — CS=D20, DC=D19, RST=D18, BUSY=D9
; Buttons: LEFT=D3, RIGHT=D4, UP=D5, SELECT=D6, DOWN=D17
; I2C sensors (Wire1): SDA=D8 (P1.04), SCL=D7 (P0.11)
; EXT_VCC=D21

[ProMicro_WeAct_base]
extends = nrf52_base
board = promicro_nrf52840
build_flags = ${nrf52_base.build_flags}
    -I variants/promicro_eink_spi
    -D PROMICRO_WEACT_EINK
    -D USE_SX1262
    -D RADIO_CLASS=CustomSX1262
    -D WRAPPER_CLASS=CustomSX1262Wrapper
    -D LORA_TX_POWER=22
    -D SX126X_CURRENT_LIMIT=140
    -D SX126X_RX_BOOSTED_GAIN=1
    -D EINK_SCALE_X=1.0f
    -D EINK_SCALE_Y=1.0f
    -D EINK_X_OFFSET=0
    -D EINK_Y_OFFSET=0
    -D CYRILLIC_SUPPORT=1
    -DEINK_SHARED_SPI
    -D PIN_DISPLAY_CS=20
    -D PIN_DISPLAY_DC=19
    -D PIN_DISPLAY_RST=18
    -D PIN_DISPLAY_BUSY=9
    -D PIN_USER_BTN=6
    -D UI_HAS_JOYSTICK=1
    -D ENV_PIN_SDA=8
    -D ENV_PIN_SCL=7
    -D ENV_INCLUDE_INA219=1
    -D ENV_INCLUDE_INA226=1
    -D ENV_INCLUDE_INA3221=1
    -D ENV_INCLUDE_BME280=1
build_src_filter = ${nrf52_base.build_src_filter}
    +<../variants/promicro_eink_spi>
    +<helpers/sensors>
lib_deps = ${nrf52_base.lib_deps}
    zinggjm/GxEPD2 @ 1.6.2
    bakercp/CRC32 @ ^2.0.0
    adafruit/Adafruit INA219 @ ^1.2.3
    adafruit/Adafruit INA3221 Library @ ^1.0.1
    robtillaart/INA226 @ ^0.6.4
    adafruit/Adafruit BME280 Library @ ^2.3.0

; ---- E22 (standard SX1262, no RX patch) ----
[ProMicro_WeAct_E22]
extends = ProMicro_WeAct_base

; ---- RA-62 (Heltec HT-RA62, SX1262-based) ----
[ProMicro_WeAct_RA62]
extends = ProMicro_WeAct_base
build_flags =
    ${ProMicro_WeAct_base.build_flags}
    -D LORA_FREQ=869.075
    -D LORA_BW=62.5
    -D LORA_SF=8
    -D LORA_CR=8

; ---- E22P (SX1262 with RX patch for improved receive) ----
[ProMicro_WeAct_E22P]
extends = ProMicro_WeAct_base
build_flags =
    ${ProMicro_WeAct_base.build_flags}
    -D SX126X_REGISTER_PATCH=1

; --- REPEATER base (E22) ---
[repeater_base_E22]
extends = ProMicro_WeAct_E22
build_flags =
    ${ProMicro_WeAct_E22.build_flags}
    -D DISPLAY_CLASS=GxEPDDisplay
    -D ADVERT_LAT=0.0
    -D ADVERT_LON=0.0
    -D ADMIN_PASSWORD="password"
    -D MAX_NEIGHBOURS=50
build_src_filter =
    ${ProMicro_WeAct_E22.build_src_filter}
    +<helpers/ui/GxEPDDisplay.cpp>
    +<helpers/ui/MomentaryButton.cpp>
    +<../examples/simple_repeater>
lib_deps = ${ProMicro_WeAct_E22.lib_deps}

