; ProMicro NRF52840 + WeAct Epaper 2.13" + EBYTE E22P (SX1262 with RX patch)
; LoRa SPI (custom via SPI.setPins): SCK=D12(P1.11), MOSI=D14(P1.15), MISO=D15(P0.02)
;   NSS=D13(P1.13), BUSY=D16(P0.29), DIO1=D11(P0.10), RST=D10(P0.09)
;   LoRa powered directly from 3.3V (no software power switch)
; Display SPI1: SCK=D18(P1.01), MOSI=D20(P1.07), CS=D5, DC=D7, RST=D9, BUSY=D8
;   Note: D20 remapped to P1.07 in g_ADigitalPinMap (P1.05 not routed on this board)
; GPS: Serial1 RX=D0(P0.08), TX=D1(P0.06), EN=D21(P0.13)
; Button/BACK: D6(P1.00, BOOT)

[ProMicro_EinkV2_base]
extends = nrf52_base
board = promicro_nrf52840
build_flags = ${nrf52_base.build_flags}
  -I variants/promicro_eink_spi_v2
  -D NRF52_POWER_MANAGEMENT
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1
  -D EINK_DISPLAY_MODEL=GxEPD2_213_B74
  -D EINK_SCALE_X=1.953125f
  -D EINK_SCALE_Y=1.28f
  -D EINK_X_OFFSET=0
  -D EINK_Y_OFFSET=10
  -D PIN_DISPLAY_CS=5
  -D PIN_DISPLAY_DC=7
  -D PIN_DISPLAY_RST=9
  -D PIN_DISPLAY_BUSY=8
  -D PIN_USER_BTN=6
  -D PIN_BUZZER=22
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_RX=0
  -D PIN_GPS_TX=1
  -D PIN_GPS_EN=21
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/promicro_eink_spi_v2>
  +<helpers/sensors>
lib_deps = ${nrf52_base.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6
  zinggjm/GxEPD2 @ 1.6.2
  bakercp/CRC32 @ ^2.0.0

[env:ProMicro_EinkV2_E22P_repeater]
extends = ProMicro_EinkV2_base
build_flags =
  ${ProMicro_EinkV2_base.build_flags}
  -D DISPLAY_CLASS=GxEPDDisplay
  -D ADVERT_NAME='"EinkV2 E22P Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${ProMicro_EinkV2_base.build_src_filter}
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_repeater>
lib_deps = ${ProMicro_EinkV2_base.lib_deps}

[env:ProMicro_EinkV2_E22P_room_server]
extends = ProMicro_EinkV2_base
build_flags =
  ${ProMicro_EinkV2_base.build_flags}
  -D DISPLAY_CLASS=GxEPDDisplay
  -D ADVERT_NAME='"EinkV2 E22P Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${ProMicro_EinkV2_base.build_src_filter}
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_room_server>
lib_deps = ${ProMicro_EinkV2_base.lib_deps}

[env:ProMicro_EinkV2_E22P_companion_radio_usb]
extends = ProMicro_EinkV2_base
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${ProMicro_EinkV2_base.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=GxEPDDisplay
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D AUTO_OFF_MILLIS=0
  -D OFFLINE_QUEUE_SIZE=256
  -D UI_RECENT_LIST_SIZE=6
  -D UI_SENSORS_PAGE=1
build_src_filter = ${ProMicro_EinkV2_base.build_src_filter}
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${ProMicro_EinkV2_base.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:ProMicro_EinkV2_E22P_companion_radio_ble]
extends = ProMicro_EinkV2_base
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
