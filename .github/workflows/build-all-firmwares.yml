name: Build All Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Firmware version (e.g. v1.15.0b4)'
        required: true
        default: 'v1.15.0b4'
  push:
    tags:
      - 'all-v*'

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve Version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG##*-}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

  build-companion:
    needs: setup
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Companion Firmwares
        env:
          FIRMWARE_VERSION: ${{ needs.setup.outputs.version }}
        run: /usr/bin/env bash build.sh build-companion-firmwares

      - name: Upload Companion Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: companion-firmwares
          path: out

  build-repeater:
    needs: setup
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Repeater Firmwares
        env:
          FIRMWARE_VERSION: ${{ needs.setup.outputs.version }}
        run: /usr/bin/env bash build.sh build-repeater-firmwares

      - name: Upload Repeater Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repeater-firmwares
          path: out

  build-room-server:
    needs: setup
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Room Server Firmwares
        env:
          FIRMWARE_VERSION: ${{ needs.setup.outputs.version }}
        run: /usr/bin/env bash build.sh build-room-server-firmwares

      - name: Upload Room Server Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: room-server-firmwares
          path: out

  release:
    needs: [setup, build-companion, build-repeater, build-room-server]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:

      - name: Download All Firmware Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-firmwares
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.setup.outputs.version }}
          body: ""
          draft: true
          files: all-firmwares/*
