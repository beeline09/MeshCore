name: Setup Build Environment
runs:
  using: "composite"
  steps:

    # Restore before pip/PlatformIO so toolchains + packages + pip wheels hit cache.
    - name: Cache pip and PlatformIO
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.platformio
        key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
          ${{ runner.os }}-pio

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install PlatformIO
      shell: bash
      run: |
        pip install --upgrade platformio

    # a git tag of "room-server-v1.2.3" should set "v1.2.3" as GIT_TAG_VERSION
    - name: Extract Version from Git Tag
      shell: bash
      run: |
        GIT_TAG_NAME="${GITHUB_REF#refs/tags/}"
        echo "GIT_TAG_VERSION=${GIT_TAG_NAME##*-}" >> $GITHUB_ENV
